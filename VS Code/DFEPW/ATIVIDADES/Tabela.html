<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        table, td, th{
            border: 1px solid black;
        }
        table{
            border-collapse: collapse;
            width: 80%;
        }
        </style>
</head>
<body>
    <table>
            <th colspan="3">Célula 1</th>
        <tr>
            <td>Célula 2</td>
            <td>Célula 3</td>
            <td>Célula 4</td>
        </tr>
        <tr>    
            <td colspan="2" rowspan="2">Célula 5</td>
            <td>Célula 6</td>
        </tr>
        <tr>    
            <td>Célula 7</td>
        </tr>   
        <tr>
            <td>Célula 8</td>
            <td>Célula 9</td>
            <td>Célula 10</td>       
        </tr>
    </table>
    <p></p>
    <a href="index.html">Voltar para Glossário</a>
    
</body>
</html>
