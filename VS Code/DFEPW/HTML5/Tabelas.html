<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas em HTML</title>
    <style>
        table, tr, td, th{
            border: 1px solid black;
        }
        table{
            border-collapse: collapse;
            width: 65%;
        }
    </style>
</head>
<body>
    <table>
            <th colspan="2">Célula 1</th>
        </tr>
        <tr>
            <td rowspan="2">Célula 3</td>
            <td>Célula 4</td>
        </tr>
        <tr>
            <td>Célula 5</td>
        </tr>
    </table>
</body>
</html>
